<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="cnicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="600" height="380" rx="20" fill="url(#cnicBg)" stroke="#10b981" stroke-width="3"/>
  <rect x="20" y="20" width="560" height="340" rx="14" fill="none" stroke="#059669" stroke-dasharray="8 6" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Header -->
  <text x="300" y="55" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ISLAMIC REPUBLIC OF PAKISTAN</text>
  <text x="300" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7" text-anchor="middle">حکومت پاکستان - قومی شناختی کارڈ</text>
  
  <!-- Photo Box -->
  <rect x="40" y="105" width="130" height="165" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <circle cx="105" cy="165" r="36" fill="#334155"/>
  <path d="M60 250 C60 210, 150 210, 150 250 Z" fill="#334155"/>
  
  <!-- Chip -->
  <rect x="200" y="105" width="65" height="50" rx="8" fill="url(#chip)" stroke="#a16207" stroke-width="1.5"/>
  <line x1="200" y1="130" x2="265" y2="130" stroke="#854d0e" stroke-width="1.5"/>
  <line x1="232" y1="105" x2="232" y2="155" stroke="#854d0e" stroke-width="1.5"/>
  
  <!-- Details -->
  <text x="200" y="180" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Name / نام</text>
  <text x="200" y="202" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff">MUHAMMAD USMAN / محمد عثمان</text>
  
  <text x="200" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Father Name / والد کا نام</text>
  <text x="200" y="255" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">RASHID AHMED / رشید احمد</text>
  
  <text x="40" y="315" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7">Identity Number / شناختی نمبر</text>
  <text x="40" y="342" font-family="monospace" font-size="22" font-weight="900" fill="#fef08a" letter-spacing="3">35202-1234567-1</text>

  <!-- Watermark Stamp -->
  <circle cx="510" cy="270" r="45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>
  <text x="510" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle" opacity="0.5">NADRA PAKISTAN</text>
</svg>
