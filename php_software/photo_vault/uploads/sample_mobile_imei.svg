<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#phoneBg)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Mobile Device Outline -->
  <rect x="70" y="40" width="160" height="300" rx="25" fill="#020617" stroke="#64748b" stroke-width="4"/>
  <!-- Camera bump -->
  <rect x="90" y="60" width="45" height="100" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="112" cy="85" r="14" fill="#000000" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="112" cy="115" r="14" fill="#000000" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="112" cy="142" r="8" fill="#e2e8f0"/>
  
  <!-- IMEI Sticker Box on back -->
  <rect x="90" y="190" width="120" height="90" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="210" font-family="sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">SAMSUNG ELECTRONICS</text>
  <text x="150" y="225" font-family="monospace" font-size="8" font-weight="bold" fill="#0284c7" text-anchor="middle">IMEI 1: 356789123456781</text>
  <text x="150" y="238" font-family="monospace" font-size="8" font-weight="bold" fill="#0284c7" text-anchor="middle">IMEI 2: 356789123456782</text>
  <!-- Mini Barcode -->
  <rect x="100" y="248" width="100" height="20" fill="#000000" opacity="0.8"/>
  
  <!-- Right Side Inspection Labels -->
  <rect x="270" y="40" width="290" height="300" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="290" y="75" font-family="sans-serif" font-size="16" font-weight="900" fill="#38bdf8">موبائل ڈیوائس تصدیق و کنڈیشن</text>
  <line x1="290" y1="90" x2="530" y2="90" stroke="#334155" stroke-width="1"/>
  
  <text x="290" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Model: <tspan fill="#ffffff">Samsung Galaxy A15 (Black)</tspan></text>
  <text x="290" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Condition: <tspan fill="#34d399">10/10 Like New / Clean</tspan></text>
  <text x="290" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">PTA Status: <tspan fill="#38bdf8">Official PTA Approved</tspan></text>
  <text x="290" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">IMEI 1: <tspan fill="#facc15" font-family="monospace">356789123456781</tspan></text>
  <text x="290" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">IMEI 2: <tspan fill="#facc15" font-family="monospace">356789123456782</tspan></text>
  <text x="290" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Storage / RAM: <tspan fill="#ffffff">6GB RAM / 128GB</tspan></text>
  <text x="290" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">✓ دکان ریکارڈ اور قانونی جانچ کیلئے محفوظ</text>
</svg>
