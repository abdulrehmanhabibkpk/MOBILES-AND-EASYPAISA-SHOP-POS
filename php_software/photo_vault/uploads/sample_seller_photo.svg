<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="sellerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#sellerBg)" stroke="#818cf8" stroke-width="2"/>
  
  <!-- Profile Avatar Circle -->
  <circle cx="160" cy="180" r="100" fill="#1e293b" stroke="#6366f1" stroke-width="4"/>
  <!-- Head & Shoulders -->
  <circle cx="160" cy="140" r="45" fill="#475569"/>
  <path d="M90 260 C90 195, 230 195, 230 260 Z" fill="#334155"/>
  <circle cx="160" cy="180" r="100" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Right Details -->
  <rect x="290" y="50" width="280" height="280" rx="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="85" font-family="sans-serif" font-size="16" font-weight="900" fill="#a5b4fc">موبائل فروخت کنندہ (سیلر)</text>
  <line x1="310" y1="100" x2="550" y2="100" stroke="#334155" stroke-width="1"/>
  
  <text x="310" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">نام: <tspan fill="#ffffff">محمد عثمان</tspan></text>
  <text x="310" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">فون نمبر: <tspan fill="#38bdf8" font-family="monospace">0301-2345678</tspan></text>
  <text x="310" y="190" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">شناختی کارڈ: <tspan fill="#facc15" font-family="monospace">35202-1234567-1</tspan></text>
  <text x="310" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">فروخت کردہ موبائل: <tspan fill="#ffffff">Samsung Galaxy A15</tspan></text>
  <text x="310" y="250" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">رسید نمبر: <tspan fill="#34d399" font-family="monospace">PUR-2024-0091</tspan></text>
  <text x="310" y="295" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4ade80">✓ لائیو کیمرہ کیپچر شدہ تصویر</text>
</svg>
